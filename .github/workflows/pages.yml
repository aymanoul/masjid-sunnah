# Baut die Seite und veröffentlicht sie auf GitHub Pages (Vorschau).
# Läuft bei jedem Push auf main, per Hand und täglich, damit die Gebetszeiten aktuell bleiben.
# Einmalig nötig: Settings > Pages > Source: "GitHub Actions".
name: Vorschau und täglicher Build
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /masjid-sunnah # Vorschau im Unterpfad; auf der Hauptdomain entfernen
      NEXT_PUBLIC_NOINDEX: "1" # Vorschau nicht von Suchmaschinen indexieren; vor Livegang entfernen
      NEXT_PUBLIC_SITE_URL: https://aymanoul.github.io # Ursprung für Open Graph, Sitemap; auf der Hauptdomain entfernen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build # prebuild lädt MAWAQIT; bei Fehler Warnung und Fallback-Datei, Build bricht nicht ab
      - run: npm run check # Links, externe Ressourcen, noindex/Sitemap, Metadaten
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
